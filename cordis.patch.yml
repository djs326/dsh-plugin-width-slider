# dsh-plugin-width-slider: multi-feature DSH plugin (width slider, thinking
# enhancements, UI patches; every feature has a toggle in
# the settings control page). Press the slider to enter preview mode
# (transparent full-screen overlay with only the slider visible), then drag to
# resize the conversation content width. Writes dsh.conversation.contentWidth
# (localStorage) and --dsh-chat-user-width (CSS variable) for instant feedback.

- insert:
    - id: width-slider
      name: 'dsh-plugin-width-slider'