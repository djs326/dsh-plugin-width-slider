# dsh-plugin-width-slider: adds a width slider in the settings section that
# replaces the native width handles. Long-press the slider to enter preview
# mode (transparent full-screen overlay with only the slider visible), then
# drag to resize the conversation content width. Writes
# dsh.conversation.contentWidth (localStorage) and --dsh-chat-user-width (CSS
# variable) for instant feedback.

- insert:
    - id: width-slider
      name: 'dsh-plugin-width-slider'